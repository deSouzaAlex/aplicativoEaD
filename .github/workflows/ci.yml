name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (API + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      NODE_ENV: test
      MONGODB_URI_TEST: mongodb://localhost:27017
      JWT_SECRET: segredo-de-teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run test:cobertura

  frontend:
    name: Frontend (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app_frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  analise:
    name: Módulo preditivo (fase 2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python treinar_modelos.py --sintetico 300
